# Todos los textos enviados por la integracion de Discord.
# Placeholders disponibles segun el mensaje:
# %player%, %server%, %date%, %cause%, %coordinates%, %day%, %changes% y %message%.

Console:
  Disabled: El bot de Discord esta desactivado en discord/config.yml.
  MissingToken: Discord esta activado, pero Bot.Token esta vacio.
  Connecting: Conectando el bot integrado de Discord...
  Connected: Bot conectado como %bot%.
  ConnectionFailed: 'No se pudo conectar el bot: %error%'
  ConnectionClosed: La conexion de Discord se cerro antes de quedar lista.
  Migrated: La configuracion antigua de Discord fue migrada a discord/config.yml.
  ChannelNotFound: No se encontro el canal %channel% configurado en %path%.
  MessageFailed: 'No se pudo enviar un mensaje a %channel%: %error%'

Defaults:
  UnknownCause: Causa desconocida
  AfkCause: Inactividad (AFK)
  UnknownCoordinates: No disponibles
  BareHands: sus propias manos
  UnknownMob: una criatura desconocida
  UnknownProjectile: un proyectil
  NoDifficultyChanges: No hay cambios configurados para este dia.

Formats:
  Coordinates: '%world%: %x%, %y%, %z%'

# Causas registradas por Minecraft/Bukkit y situaciones con atacante.
# Tambien se guardan en data/players.yml para cabezas y registros de muerte.
DeathCauses:
  PVP_MELEE: Fue asesinado por %killer% usando %weapon%.
  PVP_PROJECTILE: Fue asesinado a distancia por %killer% usando %weapon%.
  PVP_EXPLOSION: Murio en una explosion provocada por %killer%.
  PVP_PET: Fue asesinado por la mascota de %killer%.
  PVP_INDIRECT: 'Murio durante un combate contra %killer%. Causa final: %cause%'
  MOB_ATTACK: Murio atacado por %mob%.
  MOB_PROJECTILE: Murio por %projectile% disparado por %mob%.
  MOB_EXPLOSION: Murio por una explosion provocada por %mob%.
