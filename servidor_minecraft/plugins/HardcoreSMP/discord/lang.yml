Embeds:
  PluginEnabled:
    Title: HardcoreSMP
    Description: ⚙️ El servidor esta en linea y HardcoreSMP fue activado.
    Color: '#43A047'
  
  PluginDisabled:
    Title: HardcoreSMP
    Description: ⚙️ El servidor se ha apagado o HardcoreSMP fue desactivado.
    Color: '#E53935'
  
  DeathTrain:
    Title: Death Train
    Description: 🔥 %message%
    Color: '#FF5722'
  
  DifficultyChange:
    Title: Cambio de dificultad
    Description: ⏰ El servidor ha avanzado al dia **%day%**.
    Color: '#FF9800'
    Fields:
      Changes:
        Name: Cambios habilitados
        Value: '%changes%'
        Inline: false
  
  PlayerDeath:
    Title: '%player% ha muerto permanentemente en %server%'
    Description: La muerte queda registrada en HardcoreSMP.
    Color: '#D32F2F'
    Thumbnail: https://mineskin.eu/headhelm/%player%/100.png
    Reaction: ☠️
    Fields:
      Date:
        Name: 📅 Fecha
        Value: '%date%'
        Inline: true
      Cause:
        Name: 💀 Causa
        Value: '%cause%'
        Inline: true
      Coordinates:
        Name: 🧭 Coordenadas
        Value: '%coordinates%'
        Inline: true
  
  AfkBan:
    Title: '%player% fue retirado de %server%'
    Description: El jugador supero el limite de inactividad configurado.
    Color: '#7E57C2'
    Thumbnail: https://mineskin.eu/headhelm/%player%/100.png
    Reaction: ⏳
    Fields:
      Date:
        Name: 📅 Fecha
        Value: '%date%'
        Inline: true
      Cause:
        Name: ⌛ Motivo
        Value: '%cause%'
        Inline: true
