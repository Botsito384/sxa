  VOID: Cayo fuera del mundo.
  LIGHTNING: Murio alcanzado por un rayo.
  SUICIDE: Murio por su propia mano.
  KILL: Fue eliminado por un comando.
  STARVATION: Murio de hambre.
  POISON: Murio envenenado.
  MAGIC: Murio por magia.
  WITHER: Murio consumido por el efecto Wither.
  FALLING_BLOCK: Murio aplastado por un bloque que caia.
  THORNS: Murio por el encantamiento Espinas.
