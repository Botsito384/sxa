OriginalInfernalNetheriteBlock:
  Enabled: true
  RegistryOnly: false
  ActivationMode: DAY_LOCKED
  UnlockDay: 50
  OriginalFeature: OriginalRecipes.Day50
  Note: Bloque custom original colocado con diamante unbreakable.
  Item: DIAMOND
  BaseBlock: NETHERITE_BLOCK
  Display: '&6Infernal Netherite Block'
  Options:
    CustomModelData: 1
    ItemModel: minecraft:hardcoresmp/block/netherite_block
  AllowHand: false
  ToolsWhitelist:
  - PICKAXE
