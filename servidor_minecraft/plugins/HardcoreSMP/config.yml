# HardcoreSMP core config
#
# Content Studio is the main editor for gameplay, utils, custom content and day unlocks:
# /hcs gui
#
# Runtime folders:
# - edit/        Content Studio files and difficulty settings.
# - lang/        langES.yml and langEN.yml.
# - schematics/  WorldEdit schematics used by original systems.
# - data/        Runtime data such as date.yml and players.yml.

config-version: 3

Prefix: '&c&lHardcoreSMP &8| &f'

# El comando se vuelve a registrar al iniciar y con /<comando> reload.
# Usa solo letras, numeros, guion y guion bajo.
Principal-Command: xdxdd
Alliases-Principal-Command:
- dxdxd
- asd

ResourcePack:
  # Enlace directo al archivo .zip que se envia a los jugadores al entrar.
  # Dejalo vacio ('') para no enviar ningun paquete de recursos.
  Url: https://www.dropbox.com/s/h3v77ga72l9vhpg/PermaDeathCore%20RP%20v1.2.zip?dl=1

Toggles:
  # Only controls custom model data/resource-pack behavior for legacy original items.
  OptifineItems: false

Worlds:
  MainWorld: world
  EndWorld: world_the_end

WorldGeneration:
  # Removes vanilla ancient debris only while brand-new Nether chunks are populated.
  # Custom ores generated by Content Studio are placed afterwards and are not removed.
  DisableVanillaAncientDebris: false

DontTouch:
  PlayTime: 0
  Event:
    LifeOrbEnded: false
